name: thread
version: 1.0.0
description: "Operational session continuity for Hermes. Auto-captures what you were working on and what you owe at session end, then re-orients the next session so it never starts cold. Hermes never forgets the thread."
author: "Danny Purdy"
license: MIT
provides_tools:
  - thread_whats_owed
  - thread_log
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - post_llm_call
  - on_session_end
